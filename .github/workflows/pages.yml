name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the private website
        uses: actions/checkout@v6
        with:
          repository: sabereey/RookCue-Website
          ref: main
          path: website
          ssh-key: ${{ secrets.ROOKCUE_WEBSITE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/site
      - uses: actions/deploy-pages@v4
        id: deployment
