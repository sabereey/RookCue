name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      deployment: false
    permissions:
      contents: read
      pages: read
    outputs:
      artifact-name: github-pages-${{ github.run_attempt }}
    steps:
      - name: Check out the private website
        uses: actions/checkout@v6
        with:
          repository: sabereey/RookCue-Website
          ref: main
          path: website
          ssh-key: ${{ secrets.ROOKCUE_WEBSITE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: website/site

  deploy:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ needs.package.outputs.artifact-name }}
